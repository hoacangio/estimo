<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estimo — planning poker</title>
<meta name="description" content="Real-time planning poker for agile teams.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='3' y='6' width='14' height='19' rx='3' fill='none' stroke='%23141413' stroke-width='2'/%3E%3Crect x='11' y='3' width='14' height='19' rx='3' fill='%23D97757'/%3E%3C/svg%3E">

<meta name="theme-color" content="#1F1E1D" media="(prefers-color-scheme: dark)">

<style>
:root {
  --bg: #FAF9F5; --surface: #FFFFFF; --surface-2: #F0EEE6;
  --border: #E8E6DC; --border-strong: #D1CFC5; --dash: #B0AEA5;
  --ink: #141413; --ink-2: #3D3D3A; --muted: #5E5D59;
  --accent: #D97757; --accent-ink: #B1502C; --accent-soft: #F6E4DC; --accent-soft-ink: #8F3E21;
  --btn: #141413; --btn-ink: #FAF9F5; --good: #4A7A38; --bad: #B3402A;
  --outlier: #4F7FAE; --outlier-bg: #EDF3F9; --outlier-ink: #2E5E8E;
  --track: #DEDCD1; --bar-2: #E9C2B1; --shadow: rgba(20,20,19,.06); --overlay: rgba(20,20,19,.42);
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans: 'Hanken Grotesk', system-ui, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', 'SF Mono', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --bg: #1F1E1D; --surface: #262624; --surface-2: #30302E;
    --border: #3D3D3A; --border-strong: #4D4C48; --dash: #73726C;
    --ink: #F0EEE6; --ink-2: #DEDCD1; --muted: #B0AEA5;
    --accent-ink: #E69A7F; --accent-soft: #4A2E24; --accent-soft-ink: #F2C1AE;
    --btn: #F0EEE6; --btn-ink: #141413; --good: #8DBA75; --bad: #E58A74;
    --outlier: #7FA9D4; --outlier-bg: #24313F; --outlier-ink: #A9C7E6;
    --track: #3D3D3A; --bar-2: #7A4A38; --shadow: rgba(0,0,0,.3); --overlay: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1F1E1D; --surface: #262624; --surface-2: #30302E;
  --border: #3D3D3A; --border-strong: #4D4C48; --dash: #73726C;
  --ink: #F0EEE6; --ink-2: #DEDCD1; --muted: #B0AEA5;
  --accent-ink: #E69A7F; --accent-soft: #4A2E24; --accent-soft-ink: #F2C1AE;
  --btn: #F0EEE6; --btn-ink: #141413; --good: #8DBA75; --bad: #E58A74;
  --outlier: #7FA9D4; --outlier-bg: #24313F; --outlier-ink: #A9C7E6;
  --track: #3D3D3A; --bar-2: #7A4A38; --shadow: rgba(0,0,0,.3); --overlay: rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; min-height: 100vh; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent-ink); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.serif { font-family: var(--serif); }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.hidden { display: none !important; }

/* buttons & inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); font-weight: 500; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-2); }
.btn-primary { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-weight: 600; }
.btn-primary:hover:not(:disabled) { opacity: .9; border-color: var(--btn); }
.btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.btn-sm { height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; }
.btn-lg { height: 52px; font-size: 16px; }
.btn-icon { width: 40px; padding: 0; }
.theme-btns { display: inline-flex; gap: 8px; align-items: center; }
.theme-pick { height: 40px; max-width: 170px; font-size: 13px; }
.topbar .theme-pick { height: 36px; }
.btn-retro { width: auto; padding: 0 10px; font-family: var(--mono); font-size: 12px; letter-spacing: .5px; }
.btn-retro.btn-sm { padding: 0 8px; }
.btn-danger { color: var(--bad); border-color: var(--bad); background: var(--surface); }
.btn-danger:hover:not(:disabled) { background: var(--bad); color: #fff; border-color: var(--bad); }
.danger-zone { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--surface-2); font-size: 12px; }
.danger-zone .btn { align-self: flex-start; }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; font-family: var(--sans); font-weight: 500; }
.tag.host { color: var(--accent-ink); border-color: var(--accent); }
.notice { margin-top: 14px; padding: 12px 14px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-soft-ink); font-size: 14px; }
.notice-rooms { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.notice-rooms a { font-size: 13px; }
.install { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--border-strong); font-size: 13px; color: var(--muted); }
.install img { width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; }
.install .grow { flex: 1; min-width: 0; }
.install strong { color: var(--ink); display: block; font-size: 14px; }
.btn-link { border: none; background: none; color: var(--accent-ink); padding: 4px 0; font-size: 14px; }
.input { height: 48px; width: 100%; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); padding: 0 14px; font-size: 16px; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.label { font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
.chip { display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); font-size: 14px; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-weight: 600; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

/* logo */
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.logo b { font-family: var(--serif); font-weight: 600; font-size: 21px; }
.logo .back { fill: none; stroke: var(--ink); stroke-width: 2; }
.logo .front { fill: var(--accent); }

/* ---------- home ---------- */
.home { min-height: 100vh; display: flex; flex-direction: column; }
.home header { display: flex; justify-content: space-between; align-items: center; padding: 20px 32px; }
.home main { flex: 1; display: flex; justify-content: center; padding: 40px 16px 64px; }
.home .wrap { width: 100%; max-width: 980px; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start; }
.hero { flex: 1 1 380px; min-width: 0; padding-top: 24px; }
.hero .eyebrow { margin: 0 0 18px; font-size: 14px; font-weight: 500; color: var(--accent-ink); }
.hero h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(40px, 6vw, 56px); line-height: 1.08; }
.hero p { margin: 22px 0 0; font-size: 18px; color: var(--muted); max-width: 430px; }
.fan { display: flex; gap: 12px; margin-top: 44px; }
.fan div { width: 64px; height: 92px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 30px; font-weight: 500; }
.fan div:nth-child(1) { transform: rotate(-6deg); }
.fan div:nth-child(2) { transform: translateY(-10px); background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.fan div:nth-child(3) { transform: rotate(6deg); }
.panel { flex: 1 1 420px; min-width: 0; padding: 32px; border-radius: 18px; box-shadow: 0 10px 30px var(--shadow); }
.hint { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.hint svg.i { width: 14px; height: 14px; }
.decks { display: flex; flex-wrap: wrap; gap: 8px; }
.divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; color: var(--muted); font-size: 13px; }
.divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.join-row { display: flex; gap: 8px; }
.join-row .input { font-family: var(--mono); font-size: 15px; }
.recent { margin-top: 26px; border-top: 1px solid var(--surface-2); padding-top: 20px; }
.recent h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); }
.recent a { display: flex; justify-content: space-between; padding: 12px 0; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--surface-2); }
.recent a:last-child { border-bottom: none; }
.home footer { padding: 20px 32px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

/* ---------- join gate ---------- */
.gate { min-height: 100vh; display: flex; justify-content: center; padding: 24px 20px; }
.gate .inner { width: 100%; max-width: 420px; display: flex; flex-direction: column; }
.gate h1 { margin: 8px 0 0; font-family: var(--mono); font-weight: 500; font-size: 24px; word-break: break-all; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; color: var(--ink-2); }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* ---------- room ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.topbar .left, .topbar .right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar .sep { width: 1px; height: 24px; background: var(--border); }
.code { font-family: var(--mono); font-size: 14px; color: var(--ink-2); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--good); }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.live.off { color: var(--bad); }
select.select { height: 36px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); padding: 0 8px; font-size: 14px; }
.me { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 4px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-soft-ink); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; }

.layout { display: flex; flex-wrap: wrap; gap: 24px; padding: 24px; align-items: flex-start; max-width: 1440px; margin: 0 auto; }
.main { flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.side { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 960px) { .side { max-width: 360px; } }

.topic { padding: 16px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.topic .field { flex: 1 1 280px; min-width: 0; }
.topic label { font-size: 13px; font-weight: 500; color: var(--muted); }
.topic input { display: block; width: 100%; border: none; background: transparent; padding: 2px 0; font-family: var(--serif); font-size: 20px; font-weight: 500; }
.topic input:focus { outline: none; box-shadow: 0 2px 0 var(--accent); }

.table { background: var(--surface-2); border-radius: 20px; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
.seats { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; }
.seat { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 76px; }
.seat .name { font-size: 14px; font-weight: 500; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seat.mine .name { font-weight: 600; }
.pcard { width: 60px; height: 86px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-size: 30px; font-weight: 600; transition: transform .25s ease; }
.pcard.empty { border: 2px dashed var(--dash); }
.pcard.down { background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--accent); }
.pcard.up { background: var(--surface); border: 2px solid var(--accent); color: var(--ink); }
.pcard.up.flip { animation: flip .35s ease; }
.pcard.up.off { border: 1px solid var(--border-strong); }
.pcard.up.outlier { background: var(--outlier-bg); border: 2px dashed var(--outlier); color: var(--outlier-ink); }
.pcard.up.none { border: 1px dashed var(--dash); color: var(--muted); font-size: 16px; }
@keyframes flip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }
.status { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.progress { width: 240px; max-width: 100%; height: 6px; border-radius: 999px; background: var(--track); overflow: hidden; }
.progress div { height: 100%; background: var(--accent); transition: width .3s ease; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.legend { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.legend span { width: 12px; height: 12px; border-radius: 3px; border: 2px dashed var(--outlier); background: var(--outlier-bg); }

.hand { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.hand .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding-top: 12px; }
.vcard { width: 56px; height: 80px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); font-family: var(--serif); font-size: 26px; font-weight: 500; color: var(--ink); transition: transform .15s ease, box-shadow .15s ease; display: inline-flex; align-items: center; justify-content: center; }
.vcard:hover:not(:disabled) { transform: translateY(-4px); border-color: var(--ink-2); }
.vcard.meta { border-style: dashed; border-color: var(--dash); color: var(--muted); }
.vcard[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; transform: translateY(-12px); box-shadow: 0 10px 20px rgba(217,119,87,.3); }
.vcard.wide { width: 64px; font-size: 20px; }
kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 5px; background: var(--surface); }

.stats { display: flex; flex-wrap: wrap; gap: 20px; }
.stats > .card { flex: 1 1 300px; min-width: 0; padding: 20px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.kpi span { display: block; font-size: 13px; color: var(--muted); }
.kpi b { font-family: var(--serif); font-weight: 500; font-size: 38px; line-height: 1.1; }
.kpi b.sm { font-size: 24px; }
.dist { display: flex; flex-direction: column; gap: 12px; }
.dist .row { display: flex; align-items: center; gap: 12px; }
.dist .v { width: 32px; text-align: right; font-family: var(--serif); font-weight: 600; }
.dist .bar { flex: 1; height: 14px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.dist .bar div { height: 100%; background: var(--bar-2); border-radius: 4px; }
.dist .bar div.top { background: var(--accent); }
.dist .n { width: 20px; font-size: 13px; color: var(--muted); }
.final { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.final .pick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.final .opt { min-width: 44px; height: 44px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); font-family: var(--serif); font-size: 18px; font-weight: 500; }
.final .opt[aria-pressed="true"] { border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent-soft-ink); font-weight: 600; }

.box { padding: 18px 20px; }
.box-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.box h2 { margin: 0; font-family: var(--serif); font-size: 19px; font-weight: 500; }
.plist { list-style: none; margin: 10px 0 0; padding: 0; }
.plist li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; font-size: 14px; }
.plist li .n { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plist .ok { color: var(--good); font-size: 13px; }
.plist .wait { color: var(--muted); font-size: 13px; }
.plist .tag { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
.plist li.spec-first { border-top: 1px solid var(--surface-2); margin-top: 4px; }
.hlist { list-style: none; margin: 8px 0 0; padding: 0; }
.hlist li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--surface-2); font-size: 14px; }
.hlist li:last-child { border-bottom: none; }
.hlist .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pts { flex-shrink: 0; font-family: var(--serif); font-weight: 600; font-size: 15px; background: var(--surface-2); border-radius: 6px; padding: 2px 9px; }
.total { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 14px; }

/* dialog */
.overlay { position: fixed; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
.dialog { width: 100%; max-width: 460px; max-height: 100%; overflow: auto; background: var(--surface); border-radius: 20px; padding: 28px; box-shadow: 0 24px 60px rgba(20,20,19,.25); display: flex; flex-direction: column; gap: 20px; }
.dialog h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 28px; }
.qr { align-self: center; padding: 18px; border-radius: 16px; background: #fff; border: 1px solid var(--border); position: relative; line-height: 0; }
.qr svg { width: 232px; height: 232px; display: block; }
.qr .mark { position: absolute; left: 50%; top: 50%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; }
.qr .mark i { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); display: block; }
.dialog.full { max-width: none; width: 100%; height: 100%; justify-content: center; align-items: center; text-align: center; border-radius: 0; }
.dialog.full .qr svg { width: min(70vh, 80vw); height: min(70vh, 80vw); }
.dialog.full .qr .mark { width: 12%; height: 12%; margin: -6% 0 0 -6%; }
.dialog.full .qr .mark i { width: 70%; height: 70%; }
.dialog.full .full-hide { display: none; }
.dialog .full-only { display: none; }
.dialog.full .full-only { display: block; font-family: var(--mono); font-size: clamp(18px, 3vw, 32px); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--btn); color: var(--btn-ink); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 30; box-shadow: 0 10px 30px var(--shadow); }
.banner { background: var(--accent-soft); color: var(--accent-soft-ink); text-align: center; font-size: 14px; padding: 8px 16px; }

/* mobile */
@media (max-width: 640px) {
  .home header, .home footer { padding: 16px 20px; }
  .panel { padding: 22px; }
  .topbar { padding: 10px 14px; }
  .topbar .hide-sm { display: none; }
  .layout { padding: 14px; gap: 16px; }
  .table { padding: 24px 12px; }
  .seats { gap: 14px; }
  .hand { position: sticky; bottom: 0; background: var(--bg); padding: 4px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 4; }
  .hand .cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; gap: 8px; }
  .vcard, .vcard.wide { width: auto; height: 64px; }
  .vcard[aria-pressed="true"] { transform: none; }
  :root:not([data-theme="retro2007"]) .vcard[aria-pressed="true"]:active:not(:disabled) { transform: scale(.95); }
  .hand .tip { display: none; }
}
/* App-like press feedback. Applies to the default, Cinema, Samurai and Mission Control
   themes; Retro 2007 keeps its own glossy press. Quick press-in, springy release. */
button, a, select, label, input { -webkit-tap-highlight-color: transparent; }
button, .btn, .chip, .vcard, .opt { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
:root:not([data-theme="retro2007"]) :where(button, a.btn, .btn-link, select, .check, .recent a, .notice-rooms a, .logo, .vcard) {
  transition: transform .18s cubic-bezier(.3, 1.5, .5, 1), filter .15s ease, background-color .15s ease, box-shadow .15s ease, opacity .15s ease;
}
:root:not([data-theme="retro2007"]) :where(button, a.btn, .btn-link, select, .logo):active:not(:disabled) {
  transform: scale(.95); filter: brightness(.92); transition-duration: .06s;
}
:root:not([data-theme="retro2007"]) :where(.check, .recent a, .notice-rooms a):active { transform: scale(.98); opacity: .7; transition-duration: .06s; }
.logo { display: inline-flex; transform-origin: left center; }
:root:not([data-theme="retro2007"]) .vcard:active:not(:disabled) { transform: translateY(2px) scale(.93); transition-duration: .06s; }
:root:not([data-theme="retro2007"]) .vcard[aria-pressed="true"]:active:not(:disabled) { transform: translateY(-10px) scale(.95); }
:root:not([data-theme="retro2007"]) .vcard.pop { animation: card-pop .32s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes card-pop { from { transform: translateY(2px) scale(.9); } }

/* ---- App-like motion (all themes except Retro 2007) ---- */
/* Screen changes cross-fade and slide (View Transitions API; skipped where unsupported) */
::view-transition-old(root) { animation: vt-out .16s ease both; }
::view-transition-new(root) { animation: vt-in .26s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes vt-out { to { opacity: 0; transform: translateY(-6px); } }
@keyframes vt-in { from { opacity: 0; transform: translateY(10px); } }

/* Invite: centred card on desktop, bottom sheet on phones */
:root:not([data-theme="retro2007"]) .overlay.enter { animation: fade-in .2s ease both; }
:root:not([data-theme="retro2007"]) .overlay.enter .dialog { animation: dialog-in .28s cubic-bezier(.2, .9, .3, 1) both; animation-delay: inherit; }
@keyframes fade-in { from { opacity: 0; } }
@keyframes dialog-in { from { opacity: 0; transform: translateY(16px) scale(.97); } }
.sheet-handle { display: none; }
@media (max-width: 640px) {
  :root:not([data-theme="retro2007"]) .overlay { align-items: flex-end; padding: 0; }
  :root:not([data-theme="retro2007"]) .dialog:not(.full) { max-width: none; border-radius: 20px 20px 0 0; padding: 12px 20px calc(24px + env(safe-area-inset-bottom)); max-height: 92vh; }
  :root:not([data-theme="retro2007"]) .overlay.enter .dialog:not(.full) { animation-name: sheet-in; animation-duration: .32s; }
  :root:not([data-theme="retro2007"]) .sheet-handle { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--border-strong); margin: 0 auto 4px; }
}
@keyframes sheet-in { from { transform: translateY(100%); } }

/* Toasts slide up and fade away */
.toast.show { animation: toast-in .28s cubic-bezier(.2, .9, .3, 1.2) both; }
.toast.leave { animation: toast-out .2s ease both; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 16px) scale(.96); } }
@keyframes toast-out { to { opacity: 0; transform: translate(-50%, 8px); } }

/* A face-down card is dealt onto the table when someone votes */
:root:not([data-theme="retro2007"]) .pcard.down.deal { animation: deal .38s cubic-bezier(.2, .9, .3, 1.25) both; }
@keyframes deal { from { opacity: 0; transform: translateY(-22px) rotate(-10deg) scale(.88); } }

/* Vote progress fills smoothly */
.progress div { transition: width .45s cubic-bezier(.2, .9, .3, 1); }

/* Skeleton while the room loads */
.skeleton { display: flex; flex-direction: column; align-items: center; gap: 22px; width: 100%; }
.skeleton .row { display: flex; gap: 24px; justify-content: center; }
.skeleton .bone { background: var(--border); border-radius: 10px; position: relative; overflow: hidden; }
.skeleton .bone::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 70%, transparent), transparent);
  animation: shimmer 1.4s ease-in-out infinite; animation-delay: var(--clock, 0ms); }
@keyframes shimmer { to { transform: translateX(100%); } }

/* Feels like an installed app: frosted header, no rubber-band page, no long-press menus on controls */
.topbar { background: color-mix(in srgb, var(--surface) 82%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); }
button, .vcard, .btn { -webkit-touch-callout: none; }
@media (display-mode: standalone) { html, body { overscroll-behavior-y: none; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="/app.js"></script>
</body>
</html>
